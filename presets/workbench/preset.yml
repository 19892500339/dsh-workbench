name: "我的工作台（含代码检索）· My Workbench (Code Search)"
description: "基于标准模式的个人工作台预设：完整编码 Agent 能力（Shell、文件与网页检索、Skills、计划、目标、子代理、工作流），并内置结构化代码检索工具 workbench_code_find —— 实时符号级定位（类/函数/方法/常量/类型/HTML id 与 class/CSS 选择器），支持 kind 与文件过滤、代码预览，自动提取邻近注释说明，按文件版本增量缓存、永不过期，可弥补 workbench_code_locate 对声明型文件与 HTML/CSS 的覆盖盲区。可与任何预设并存。A standard-based personal preset: full coding agent plus workbench_code_find for live symbol-level code search (classes, functions, methods, constants, types, HTML ids/classes, CSS selectors) with kind/file filters and preview; coexists with any preset."
